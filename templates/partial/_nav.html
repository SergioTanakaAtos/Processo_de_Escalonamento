{% load static %}
{% block style %}
<style>
    .navbar-custom {
        width: 100%;
        z-index: 1000;
        padding: 10px 0;
        justify-content: center;
        display: flex;
    }

    .navbar-custom .navbar-nav .nav-link {
        color: #fff;
        padding: 10px 15px;
        background-color: #073958;
        justify-content: center;
        border: 1px solid transparent;
    }

    .navbar-custom.active .navbar-nav .nav-link {
        width: 130px; 
        border: 1px solid #fff; 
        border-radius: 3px;
    }
</style>
{% endblock style%}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom" id="navbar">
    <div class="container-fluid">
        <!-- Navbar toggle button (hamburger icon) -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar items -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'initial_page' %}">Empresas</a>
                    </li>
                {% endif %}
                {% if user.is_superuser %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'permissions' %}">Permissões</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'management' %}">Controle de acesso</a>
                    </li>
                {% endif %}
            </ul>

            <ul class="navbar-nav ml-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdownLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            {{ user }}
                        </a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdownLink" style="min-width: 100px;">
                            <a class="dropdown-item" href="{% url 'logout' %}">Sair</a>
                        </div>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var navbarToggle = document.querySelector(".navbar-toggler");
        var navbar = document.getElementById("navbar");

        navbarToggle.addEventListener("click", function() {
            navbar.classList.toggle("active");
        });
    });
</script>
